<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope view: picture-in-picture eyebox simulator</title>
<style>
:root{color-scheme:dark;--bg:#050607;--panel:rgba(12,15,18,.84);--ink:#dde4e8;--mute:#8996a0;--acc:#7fd3b0;--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#p{position:absolute;right:12px;bottom:12px;width:244px;padding:12px 14px;background:rgba(12,15,18,.93);border:1px solid var(--line);border-radius:10px}
#p label{display:block;margin:0 0 8px;color:var(--mute)}
#p label span{display:flex;justify-content:space-between;color:var(--ink)}
#p output{color:var(--acc);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--acc)}
select{width:100%;background:#12171b;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;margin-bottom:8px}
.chk{display:flex!important;align-items:center;gap:6px;margin:0 0 6px!important;color:var(--ink)!important}
.hint{margin:6px 0 0;color:var(--mute);font-size:12px}
@media(max-width:700px){#p{left:8px;right:8px;width:auto;bottom:8px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="p">
<label><span>Magnification <output id="o_mag"></output></span><input id="mag" type="range" min="1" max="16" step="0.1" value="6"></label>
<label><span>Eye relief <output id="o_er"></output></span><input id="er" type="range" min="60" max="130" step="1" value="90"></label>
<label><span>Head offset, horizontal <output id="o_hx"></output></span><input id="hx" type="range" min="-15" max="15" step="0.1" value="0"></label>
<label><span>Head offset, vertical <output id="o_hy"></output></span><input id="hy" type="range" min="-15" max="15" step="0.1" value="0"></label>
<label><span>Parallax error <output id="o_par"></output></span><input id="par" type="range" min="0" max="100" step="1" value="10"></label>
<label><span>Time of day <output id="o_tod"></output></span><input id="tod" type="range" min="0" max="24" step="0.1" value="17"></label>
<label><span>Hold sway <output id="o_sway"></output></span><input id="sway" type="range" min="0" max="3" step="0.1" value="1"></label>
<select id="ret"><option value="ffp">Reticle: first focal plane</option><option value="sfp">Reticle: second focal plane</option></select>
<label class="chk"><input type="checkbox" id="ill"> Illuminated reticle</label>
<label class="chk"><input type="checkbox" id="follow" checked> Head follows mouse</label>
<label class="chk"><input type="checkbox" id="gyro"> Gyro aim (phone)</label>
<label id="ggl"><span>Gyro gain <output id="o_gg"></output></span><input id="gg" type="range" min="0.05" max="1" step="0.05" value="0.3"></label>
<p class="hint" id="gs" style="display:none"></p>
<p class="hint">WASD or arrows: aim. Shift+WASD: move your head (turns off mouse follow). Wheel: zoom. Shift+wheel: eye relief. Phone: turn on Gyro aim and point the phone.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d',{alpha:false});
const per=document.createElement('canvas'),pctx=per.getContext('2d',{alpha:false});
const sc=document.createElement('canvas'),sctx=sc.getContext('2d',{alpha:false});
const hc=document.createElement('canvas'),oc=document.createElement('canvas');
/* adaptive quality: s = scope render scale, d = screen dpr scale, g = grass stride */
const Q=[{s:1,d:1,g:1},{s:.88,d:1,g:1},{s:.76,d:1,g:1},{s:.64,d:.85,g:1}];
let qi=0,nd=1,panelH=0,perKey='',hKey='',ebW=0,ema=16.7,lastChg=0,bad=-1,badT=0;
function adapt(ms){if(ms>250||ms<=0)return;ema+=(ms-ema)*.05;const now=performance.now();
 if(ema>30&&qi<Q.length-1&&now-lastChg>1200){bad=qi;badT=now+15000;qi++;lastChg=now;ema=16.7;resize()}
 else if(ema<19.5&&qi>0&&now-lastChg>6000&&(qi-1!==bad||now>badT)){qi--;lastChg=now;ema=16.7;resize()}}
let W=0,H=0,dpr=1,yaw=0.4,pitch=-1.7,drag=null,hs={x:0,y:0},keys={};
function resize(){nd=Math.min(window.devicePixelRatio||1,2);dpr=Math.max(1,nd*Q[qi].d);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;per.width=Math.ceil(W/5);per.height=Math.ceil(H/5);perKey='';hKey='';panelH=$('p').offsetHeight}
addEventListener('resize',resize);resize();if(window.ResizeObserver)new ResizeObserver(()=>{panelH=$('p').offsetHeight}).observe($('p'));

/* procedural terrain: noise is sampled once into lookup tables */
function h(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function vn(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f),o=s*57.3;return h(i+o)*(1-u)+h(i+1+o)*u}
function fbm(a,s,b){let v=0,amp=1,f=b,t=0;for(let o=0;o<5;o++){v+=(vn(a*f,s+o)-.5)*amp;t+=amp;amp*=.5;f*=2.3}return v/t*2}
const L=[{s:1,b:.03,amp:5,off:4.5,col:[122,142,170]},{s:2,b:.05,amp:3.2,off:2.2,col:[94,116,142]},{s:3,b:.08,amp:2,off:.6,col:[64,88,98]},{s:4,b:.12,amp:1.2,off:-.2,col:[48,74,58]},{s:5,b:.2,amp:.7,off:-1.1,col:[95,103,63]}];
const TA0=-110,TRES=256,TN=220*TRES+3;
const ET=L.map(l=>{const t=new Float32Array(TN);for(let i=0;i<TN;i++)t[i]=l.off+fbm(TA0+i/TRES,l.s,l.b)*l.amp;return t});
const BT=new Float32Array(TN);for(let i=0;i<TN;i++)BT[i]=fbm(TA0+i/TRES,11,.35)*.25;
function sm(t,a){let u=(a-TA0)*TRES;u=u<0?0:u>TN-2.01?TN-2.01:u;const i=u|0;return t[i]+(t[i+1]-t[i])*(u-i)}
function gen(idx,k){const r=[];for(let i=0;i<600;i++)r.push({a:-100+i*200/600+(h(i*3+idx)-.5)*.6,s:(.15+h(i+idx*77)*.35)*k,v:h(i+9)});return r}
const TR=[null,null,gen(2,.9),gen(3,1.8),null];
const TG=[{a:.9,e:-2.1,d:.3,t:0},{a:-2.7,e:-1.9,d:.25,t:1},{a:3.5,e:-2.8,d:.4,t:0},{a:-6,e:-3.3,d:.6,t:0},{a:7.5,e:-1.7,d:.35,t:1}];
const NB=6,TB=4,LC=L.map(l=>'rgb('+l.col+')');
const TCOL=L.map(l=>Array.from({length:TB},(_,b)=>'rgb('+l.col.map(v=>v*(.7+(b+.5)/TB*.25)|0)+')'));
for(const T of TR)if(T)for(const t of T)t.b=Math.min(TB-1,t.v*TB|0);
const CL=[];for(let i=0;i<17;i++){const a0=-100+i*12.5+h(i)*6,e=[];for(let k=0;k<5;k++)e.push({a:a0+(k-2)*1.6,e:7+h(i+3)*16+(h(i*5+k)-.5)*.8,rx:1.4+h(i+k)*1.4,ry:.45+h(k+i*2)*.3});CL.push({a:a0,e})}
/* grass rows depend only on distance, so build them (and their colors) once */
const GR=[];for(let j=0,ed=.04;j<300&&ed<4.6;j++){const e0=ed,sz=Math.min(e0*.042,.06),hz=Math.max(0,1-e0/3)*.2,kk=1-Math.min(.2,e0*.06);ed+=sz*1.9;
 GR.push({j,e0,sz,sp:sz*1.1,cols:Array.from({length:NB},(_,b)=>{const k=(.72+(b+.5)/NB*.56)*kk;return 'rgb('+(95*k+hz*50|0)+','+(103*k+hz*40|0)+','+(63*k+hz*20|0)+')'})})}
function gh(i,j){let n=Math.imul(i,0x27d4eb2d)^Math.imul(j+0x165667b1,0x85ebca6b);n=Math.imul(n^(n>>>15),0x2c1b3c6d);n=Math.imul(n^(n>>>12),0x297a2d39);return(n^(n>>>15))>>>0}
let gx=new Float32Array(4096),gy=new Float32Array(4096),g1=new Float32Array(4096),g2=new Float32Array(4096),gb=new Uint8Array(4096);
function growG(){const n=gx.length*2,c=(A,T)=>{const B=new T(n);B.set(A);return B};gx=c(gx,Float32Array);gy=c(gy,Float32Array);g1=c(g1,Float32Array);g2=c(g2,Float32Array);gb=c(gb,Uint8Array)}
const vis=[];const GCa={c:document.createElement('canvas'),ppd:0};GCa.x=GCa.c.getContext('2d');

 
function grass(g,w,hh,ppd,yw,pt,gs){
 const cy=hh/2,hw=w/2,fov=w/ppd,Y=e=>cy-(e-pt)*ppd,E4=ET[4],ym0=Y(-5.25);
 for(const r of GR){const sz=r.sz,e0=r.e0,px=sz*ppd;if(px<.3||Y(-.4-e0)>hh+px*3||Y(-1.8-e0-sz)<-px*3)continue;
  const st=1,mul=1,sp=r.sp,a0=Math.floor((yw-fov/2)/sp)-1,a1=Math.ceil((yw+fov/2)/sp)+1,ymx=Math.min(hh+px*3,ym0+px),ymn=-px*3;let n=0;
  for(let i=a0-(((a0%st)+st)%st);i<=a1;i+=st){const u=gh(i,r.j),r1=(u&65535)/65536,r2=(u>>>16)/65536,a=(i+r1)*sp,y=cy-(sm(E4,a)-e0-r2*sz-pt)*ppd;
   if(y>ymx||y<ymn)continue;if(n===gx.length)growG();gx[n]=hw+(a-yw)*ppd;gy[n]=y;g1[n]=r1;g2[n]=r2;gb[n++]=r2*NB|0}
  if(!n)continue;
  const p=px*mul,small=p<1.6;
  for(let b=0;b<NB;b++){g.fillStyle=r.cols[b];g.beginPath();
   for(let k=0;k<n;k++){if(gb[k]!==b)continue;const x=gx[k],y=gy[k],r1=g1[k];g.moveTo(x-p*1.1,y);
    if(small){g.lineTo(x+(r1-.5)*p*.6,y-p*1.7)}
    else{const r2=g2[k];g.lineTo(x-p*.5+(r1-.5)*p,y-p*1.5);g.lineTo(x-p*.1,y);g.lineTo(x+p*.1+(r2-.5)*p*.6,y-p*1.9);g.lineTo(x+p*.4,y);g.lineTo(x+p*.5+(r1-.5)*p*.8,y-p*1.3)}
    g.lineTo(x+p*1.1,y)}
   g.fill()}}}
/* grass is baked into 512px tiles at power-of-two resolutions and just scaled/slid into place */
const TC=new Map(),TPOOL=[],TS=384,TP=6,TPX=TS+2*TP;let tfr=0,tmiss=0,tb=-1;
function tiles(g,w,hh,ppd,yw,pt){
 tfr++;let b=tb<0?Math.max(0,Math.ceil(Math.log2(ppd/32))):tb;while(ppd/(32*Math.pow(2,b))>1.15)b++;while(b>0&&ppd/(32*Math.pow(2,b))<.55)b--;tb=b;const t0=performance.now();let built=0;
 const pass=(bb,build,nodraw)=>{const pb=32*Math.pow(2,bb),k=ppd/pb,Tw=TS/pb,hw=w/2,cy=hh/2;let miss=0;
  const ix0=Math.floor((yw-hw/ppd)/Tw),ix1=Math.floor((yw+hw/ppd)/Tw),iy0=Math.floor((pt-cy/ppd)/Tw),iy1=Math.floor((pt+cy/ppd)/Tw);
  for(let iy=iy1;iy>=iy0;iy--){if((iy+1)*Tw<-5.7||iy*Tw>.4)continue;
   for(let ix=ix0;ix<=ix1;ix++){const key=bb+'|'+ix+'|'+iy;let t=TC.get(key);
    if(!t){if(!build)continue;if(built>0&&performance.now()-t0>10){miss++;continue}
     const c=TPOOL.pop()||document.createElement('canvas');c.width=c.height=TPX;
     grass(c.getContext('2d'),TPX,TPX,pb,(ix+.5)*Tw,(iy+.5)*Tw,1);t={c,f:0};TC.set(key,t);built++}
    t.f=tfr;if(!nodraw)g.drawImage(t.c,hw+(ix*Tw-yw)*ppd-TP*k,cy-((iy+1)*Tw-pt)*ppd-TP*k,TPX*k,TPX*k)}}
  return miss};
 tmiss=pass(b,true,true);
 if(tmiss){pass(b+1,false);if(b>0)pass(b-1,false)}
 pass(b,false);
 if(!tmiss){pass(b+1,true,true);if(!built&&b>0)pass(b-1,true,true)}
 if(TC.size>180){const a=[...TC.entries()].sort((x,y)=>x[1].f-y[1].f);for(let i=0;i<a.length-150;i++){TPOOL.push(a[i][1].c);TC.delete(a[i][0])}}
}
/* time of day: sun/moon path, sky colours, ambient tint (multiplied over the scene), stars. 17:00 matches the original look */
const cl01=v=>v<0?0:v>1?1:v,mixc=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k),hm=v=>{let H=Math.floor(v),M=Math.round((v-H)*60);if(M==60){H++;M=0}return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};
function ramp(T,e){if(e<=T[0][0])return T[0].slice(1);for(let i=1;i<T.length;i++)if(e<=T[i][0]){const a=T[i-1],k=(e-a[0])/(T[i][0]-a[0]);return a.slice(1).map((v,j)=>v+(T[i][j+1]-v)*k)}return T[T.length-1].slice(1)}
const SKYT=[[-18,3,5,12,6,10,24,12,18,36],[-8,10,18,48,28,40,78,70,70,104],[-2,28,52,102,120,100,130,232,138,92],[5,44,92,158,180,170,180,246,176,120],[14,58,114,180,156,195,222,240,220,192],[45,40,100,178,128,184,224,214,232,242]];
const TINTT=[[-18,62,78,130],[-9,82,94,148],[-3,170,130,135],[3,255,200,160],[9,255,236,214],[14,255,255,255]];
const STARS=Array.from({length:260},(_,i)=>({a:-100+h(i*3.1+.5)*200,e:10+h(i*7.7+3)*42,v:h(i+5.5)}));
let TOD=null;
function todState(t){
 const se=55*Math.sin(6.283*(t-6)/24),mt=(t+12)%24,me=55*Math.sin(6.283*(mt-6)/24),
 tn=ramp(TINTT,se),ts=tn.map(v=>Math.max(.05,v/255)),sk=ramp(SKYT,se),k=cl01((14-se)/16),
 pre=i=>'rgb('+[0,1,2].map(c=>Math.round(Math.min(255,sk[i*3+c]/ts[c])))+')';
 return{se,sx:18+(t-17)*5,sf:cl01((se+10)/10),sc:mixc([255,250,225],[255,170,100],k),gc:mixc([255,230,170],[255,120,50],k),
  sky:[pre(0),pre(1),pre(2)],tn:se<13.99?'rgb('+tn.map(Math.round)+')':null,me,ma:18+(mt-17)*5,mo:cl01((-se+2)/8),sa:cl01((-se-4)/10)}}
function moon(g,X,Y,ppd){const a=TOD.mo;if(a<=0||TOD.me<-2)return;const x=X(TOD.ma),y=Y(TOD.me),r=Math.max(1.5,ppd*.26),R=r*7;
 const gr=g.createRadialGradient(x,y,r*.9,x,y,R);gr.addColorStop(0,`rgba(190,205,240,${.28*a})`);gr.addColorStop(1,'rgba(190,205,240,0)');g.fillStyle=gr;g.fillRect(x-R,y-R,2*R,2*R);
 g.globalAlpha=a;g.fillStyle='#e9eef8';g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.globalAlpha=1}
function drawScene(g,w,hh,fov,yw,pt,step,gs,GC){
 const ppd=w/fov,cy=hh/2,Y=e=>cy-(e-pt)*ppd,X=a=>w/2+(a-yw)*ppd,hor=Y(0),hw=w/2;
 let gr=g.createLinearGradient(0,hor-ppd*40,0,hor+ppd*2);
 gr.addColorStop(0,TOD.sky[0]);gr.addColorStop(.6,TOD.sky[1]);gr.addColorStop(1,TOD.sky[2]);
 g.fillStyle=gr;g.fillRect(0,0,w,hh);
 const sx=X(TOD.sx),sy=Y(TOD.se),sr=ppd*7,sf=TOD.sf;
 if(sf>0){const c0=TOD.sc,c1=TOD.gc,cm=mixc(c0,c1,.3);
  gr=g.createRadialGradient(sx,sy,0,sx,sy,sr);gr.addColorStop(0,`rgba(${c0},${sf})`);gr.addColorStop(.04,`rgba(${cm},${.9*sf})`);gr.addColorStop(.25,`rgba(${c1},${.25*sf})`);gr.addColorStop(1,`rgba(${c1},0)`);
  g.fillStyle=gr;g.fillRect(sx-sr,sy-sr,sr*2,sr*2)}
 if(TOD.me<=12)moon(g,X,Y,ppd);
 g.fillStyle='rgba(255,255,255,.2775)';
 for(const c of CL){const x=X(c.a);if(x<-ppd*14||x>w+ppd*14)continue;for(const q of c.e){g.beginPath();g.ellipse(X(q.a),Y(q.e),q.rx*ppd,q.ry*ppd,0,0,6.283);g.fill()}}
 for(let li=0;li<L.length;li++){const et=ET[li];g.fillStyle=LC[li];
  g.beginPath();g.moveTo(-step,hh+1);
  for(let x=-step;x<=w+step;x+=step)g.lineTo(x,Y(sm(et,yw+(x-hw)/ppd)));
  g.lineTo(w+step,hh+1);g.fill();
  const T=TR[li];
  if(T){let n=0;const lo=yw-fov/2-1,hi=yw+fov/2+1;for(const t of T)if(t.a>=lo&&t.a<=hi)vis[n++]=t;
   for(let b=0;b<TB;b++){g.fillStyle=TCOL[li][b];g.beginPath();
    for(let i=0;i<n;i++){const t=vis[i];if(t.b!==b)continue;const by=Y(sm(et,t.a))+ppd*t.s*.1,ht=t.s*ppd,wd=ht*.22,x=X(t.a);g.moveTo(x-wd,by);g.lineTo(x,by-ht);g.lineTo(x+wd,by)}
    g.fill()}}}
 const gy0=Y(-1.1);
 gr=g.createLinearGradient(0,gy0,0,gy0+ppd*4);gr.addColorStop(0,'rgba(190,190,120,.1)');gr.addColorStop(1,'rgba(20,28,10,.28)');
 g.fillStyle=gr;g.fillRect(0,Math.max(0,gy0-ppd),w,hh);
 if(ppd>12){if(GC){tiles(g,w,hh,ppd,yw,pt)}else if(!GC)grass(g,w,hh,ppd,yw,pt,gs);
  else{const M=Math.round(w*.25),cw=w+2*M,ch=hh+2*M;let dx=(GC.yw-yw)*ppd,dy=(pt-GC.pt)*ppd;
   if(GC.ppd!==ppd||GC.gs!==gs||GC.cw!==cw||GC.ch!==ch||Math.abs(dx)>M*.9||Math.abs(dy)>M*.9){
    if(GC.c.width!==cw||GC.c.height!==ch){GC.c.width=cw;GC.c.height=ch}else GC.x.clearRect(0,0,cw,ch);
    grass(GC.x,cw,ch,ppd,yw,pt,gs);GC.yw=yw;GC.pt=pt;GC.ppd=ppd;GC.gs=gs;GC.cw=cw;GC.ch=ch;dx=dy=0}
   g.drawImage(GC.c,dx-M,dy-M)}}
 for(const t of TG){const x=X(t.a),y=Y(t.e),r=t.d/2*ppd;if(x<-r*3||x>w+r*3)continue;
  g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(x,y+r*2.15,r*1.1,r*.25,0,0,6.283);g.fill();
  g.fillStyle='#2a2a28';g.fillRect(x-r*.07,y,r*.14,r*2.1);
  if(t.t==0){g.fillStyle='#d8d2c4';g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.fillStyle='#b3392e';g.beginPath();g.arc(x,y,r*.7,0,6.283);g.fill();g.fillStyle='#e9e4d8';g.beginPath();g.arc(x,y,r*.3,0,6.283);g.fill()}
  else{g.fillStyle='#8a8e92';g.fillRect(x-r,y-r*.8,r*2,r*1.6);g.fillStyle='#caa24a';g.fillRect(x-r*.8,y-r*.6,r*1.6,r*1.2)}}
 {const bg=g.createLinearGradient(0,Y(-5),0,Y(-5)+ppd*3);bg.addColorStop(0,'#3d3b27');bg.addColorStop(1,'#12110a');g.fillStyle=bg;
  g.beginPath();g.moveTo(-step,hh+1);for(let x=-step;x<=w+step;x+=step)g.lineTo(x,Y(-5+sm(BT,yw+(x-hw)/ppd)));g.lineTo(w+step,hh+1);g.fill()}
 if(TOD.tn){g.globalCompositeOperation='multiply';g.fillStyle=TOD.tn;g.fillRect(0,0,w,hh);g.globalCompositeOperation='source-over'}
 if(TOD.sa>0){g.fillStyle='#fff';for(const s of STARS){const x=X(s.a);if(x<0||x>w)continue;const y=Y(s.e);if(y<0||y>hh)continue;const r=Math.max(.6,Math.min(2.2,ppd*.02*(.5+s.v)));g.globalAlpha=TOD.sa*(.3+.7*s.v);g.fillRect(x-r/2,y-r/2,r,r)}g.globalAlpha=1}
 if(TOD.me>12)moon(g,X,Y,ppd);
}

/* static pieces (housing, vignette) are drawn once per size and blitted */
function buildCaches(R,Ro){
 hc.width=hc.height=Math.ceil(2*Ro*dpr);let g=hc.getContext('2d');g.setTransform(dpr,0,0,dpr,Ro*dpr,Ro*dpr);
 let gr=g.createRadialGradient(0,0,R*.97,0,0,Ro);
