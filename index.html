<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope view: picture-in-picture eyebox simulator</title>
<style>
:root{color-scheme:dark;--bg:#050607;--panel:rgba(12,15,18,.84);--ink:#dde4e8;--mute:#8996a0;--acc:#7fd3b0;--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#p{position:absolute;right:12px;bottom:12px;width:244px;max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;padding:12px 14px;background:rgba(12,15,18,.93);border:1px solid var(--line);border-radius:10px}
#pt{display:block;width:100%;margin:0 0 8px;padding:7px;background:#12171b;color:var(--acc);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:600}
#p.min{width:auto;left:auto!important;padding:5px}#p.min #pt{margin:0;padding:7px 12px}#p.min>*:not(#pt){display:none}
#p label{display:block;margin:0 0 8px;color:var(--mute)}
#p label span{display:flex;justify-content:space-between;color:var(--ink)}
#p output{color:var(--acc);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--acc)}
select{width:100%;background:#12171b;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;margin-bottom:8px}
.chk{display:flex!important;align-items:center;gap:6px;margin:0 0 6px!important;color:var(--ink)!important}
.hint{margin:6px 0 0;color:var(--mute);font-size:12px}
body.port #p{left:8px;right:8px;width:auto;bottom:8px;max-height:46%}
</style></head><body>
<canvas id="c"></canvas>
<div id="p">
<button id="pt" type="button"></button>
<label><span>Magnification <output id="o_mag"></output></span><input id="mag" type="range" min="1" max="16" step="0.1" value="6"></label>
<label><span>Eye relief <output id="o_er"></output></span><input id="er" type="range" min="60" max="130" step="0.1" value="90"></label>
<label><span>Head offset, horizontal <output id="o_hx"></output></span><input id="hx" type="range" min="-15" max="15" step="0.01" value="0"></label>
<label><span>Head offset, vertical <output id="o_hy"></output></span><input id="hy" type="range" min="-15" max="15" step="0.01" value="0"></label>
<label><span>Parallax error <output id="o_par"></output></span><input id="par" type="range" min="0" max="100" step="1" value="10"></label>
<label class="chk"><input type="checkbox" id="phys" checked> Physical eyebox model</label>
<select id="pup"><option value="auto">Eye pupil: auto (time of day)</option><option value="2.5">Eye pupil: 2.5 mm</option><option value="3.5">Eye pupil: 3.5 mm</option><option value="5">Eye pupil: 5 mm</option><option value="7">Eye pupil: 7 mm</option></select>
<label><span>Time of day <output id="o_tod"></output></span><input id="tod" type="range" min="0" max="24" step="0.1" value="17"></label>
<label><span>Hold sway <output id="o_sway"></output></span><input id="sway" type="range" min="0" max="3" step="0.1" value="1"></label>
<select id="ret"><option value="ffp">Reticle: first focal plane</option><option value="sfp">Reticle: second focal plane</option></select>
<label class="chk"><input type="checkbox" id="ill"> Illuminated reticle</label>
<label class="chk"><input type="checkbox" id="follow" checked> Head follows mouse</label>
<label class="chk"><input type="checkbox" id="gyro"> Gyro head offset (phone)</label>
<label class="chk"><input type="checkbox" id="twist"> Twist phone to move eye relief</label>
<button id="gz" type="button" style="width:100%;margin:0 0 8px;padding:5px;background:#12171b;color:var(--ink);border:1px solid var(--line);border-radius:6px">Recenter phone</button>
<label id="ggl"><span>Gyro gain <output id="o_gg"></output></span><input id="gg" type="range" min="0.2" max="3" step="0.1" value="1"></label>
<p class="hint" id="gs" style="display:none"></p>
<button id="fire" type="button" style="width:100%;margin:0 0 8px;padding:8px;background:#1d2a25;color:var(--acc);border:1px solid var(--acc);border-radius:6px;font:inherit;font-weight:600">Fire (Space)</button>
<label><span>Recoil &amp; bolt shake <output id="o_rec">1.00×</output></span><input id="rec" type="range" min="0" max="2" step="0.05" value="1"></label>
<label class="chk"><input type="checkbox" id="snd" checked> Gun sounds</label>
<p class="hint">Space or click/tap: fire, then work the bolt. WASD or arrows: aim. Shift+WASD: move your head (turns off mouse follow). Wheel: zoom. Shift+wheel: eye relief. Phone: turn on Gyro head offset and tilt the phone; with Twist on, tilting the top of the phone to the right adds eye relief.</p>
</div>

/* physical eyebox. For every field angle, work out what fraction of the eye's pupil (a disc) overlaps (1) the scope's exit pupil and (2) the ocular lens aperture.

   Exit pupil: its distance from the eye is ze (eye relief minus nominal) plus a longitudinal pupil aberration DL*rho^2, so off-axis beams cross the axis closer to the
   ocular. That is what turns the shadow into a kidney bean when the head is off-axis, and the shadow swaps sides when the eye passes through the pupil plane.
   Ocular lens: radius rl, eye-to-lens distance = eye relief. Colour: red survives slightly longer at the exit pupil edge, blue at the lens edge (lateral colour).

 {a:14,R:600,wb:30,bh:3.8,stand:[[0,.6,-1.6],[5,.55,1.4],[2,.6,3.5]]},
 {a:-24,R:700,wb:28,bh:3.5,hang:[[3,.7,-2.6],[3,.6,-1.4],[3,.5,-.3],[3,.45,.7],[2,.7,2.2]],stand:[[0,.5,4.6]]},

 const duck=ac.createBiquadFilter();duck.type='lowpass';duck.frequency.value=20000;duck.Q.value=.7;duck.connect(comp);
 const dry=ac.createGain();dry.gain.value=.85;dry.connect(duck);
 const len=sr*3|0,ir=ac.createBuffer(2,len,sr),RF=[[.09,.5],[.21,.38],[.37,.34],[.62,.24],[.95,.16],[1.4,.1]];
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);let lp=0;
  for(let i=0;i<len;i++){const tt=i/sr;lp+=(Math.random()*2-1-lp)*(.03+.35*Math.exp(-tt*1.8));d[i]=2.2*lp*Math.exp(-tt*2.3)*Math.min(1,tt/.01)}
  for(const [t0,a] of RF){const s0=((t0+(c?.013:-.011))*sr)|0,n=sr*.035|0;let q=0;for(let i=0;i<n;i++){q+=(Math.random()*2-1-q)*(.12+.2*Math.exp(-t0*1.2));d[s0+i]+=a*q*3*Math.sin(Math.PI*i/n)}}}
 const conv=ac.createConvolver();conv.buffer=ir;const wet=ac.createGain();wet.gain.value=.6;conv.connect(wet);wet.connect(duck);
 const wc=new Float32Array(1024);for(let i=0;i<1024;i++)wc[i]=Math.tanh((i/511.5-1)*5);
 return BUS={dry,conv,wc,duck}}
function send(ac,w){const B=bus(ac),g=ac.createGain();g.connect(B.dry);if(w){const x=ac.createGain();x.gain.value=w;g.connect(x);x.connect(B.conv)}return g}
function nz(ac,t,tau,type,f,q,vol,w,f2,grit){bus(ac);const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NBUF;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.setTargetAtTime(f2,t,tau*1.5);
 g.gain.setValueAtTime(vol*G,t);g.gain.setTargetAtTime(0,t,tau);s.connect(fl);
 if(grit){const ws=ac.createWaveShaper();ws.curve=BUS.wc;fl.connect(ws);ws.connect(g)}else fl.connect(g);
 g.connect(send(ac,w||0));s.start(t,Math.random()*.5,tau*8)}
function modal(ac,t,fs,qs,vol,w){bus(ac);const o=send(ac,w||0),s=ac.createBufferSource(),ex=ac.createGain();s.buffer=NBUF;s.connect(ex);
 fs.forEach((f,i)=>{const fl=ac.createBiquadFilter(),g=ac.createGain();fl.type='bandpass';fl.frequency.value=f*(1+(Math.random()-.5)*.02);fl.Q.value=qs[i];g.gain.value=vol*G*360*qs[i]/f/(1+i*.5);ex.connect(fl);fl.connect(g);g.connect(o)});
 s.start(t,Math.random()*.5,.003)}
/* A struck steel plate: a sharp bullet-strike crack and a dull thunk, then the plate ringing as a bank of decaying sine modes.
   Modes are inharmonic (plate or disc ratios), the higher ones die faster, each mode is a close pair so it beats slowly, and every hit excites the modes
   a little differently. Bigger plates ring lower, each plate has its own pitch, and distance dulls the highs, lowers the level and adds more echo. */
function steel(ac,t,m){
 const T=m.T,k=T.t,R=m.R||200,sz=T.R?T.d*T.R/57.2958:.45,hv=Math.abs(Math.sin(T.a*91.7+T.e*37.3)*1e4)%1,
 f0=gcl(900*Math.pow(.5/sz,.8)*[1,1,1,.55,1,.72,1,.9][k]*(.88+.24*hv),300,3200),
 RT=k==3?[1,1.72,2.39,3.84,5.2,6.9]:[1,1.58,2.27,3.0,3.9,5.1,6.4],tau0=(k==3?.2:.13)*(.9+.2*Math.random()),
 dg=1/(1+R/300),o=send(ac,.45+Math.min(.4,R/1500)),lp=ac.createBiquadFilter();
 lp.type='lowpass';lp.frequency.value=gcl(14000/(1+R/120),1800,14000);lp.Q.value=.5;lp.connect(o);
 RT.forEach((r,i)=>{const f=f0*r;if(f>12000)return;const a=(.6+.8*Math.random())/(1+.35*i),tau=tau0/(1+.8*i);
  for(const dt of[0,(.001+.005*Math.random())*(Math.random()<.5?-1:1)]){
   const os=ac.createOscillator(),g=ac.createGain();os.frequency.value=f*(1+dt);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a*.2*dg*G,t+.0006);g.gain.setTargetAtTime(0,t+.0006,tau);
   os.connect(g);g.connect(lp);os.start(t);os.stop(t+tau*7+.1)}});
 nz(ac,t,.003,'highpass',2200,.7,.8*dg,.3,0,true);
 nz(ac,t,.02,'lowpass',500+700*hv,.8,.45*dg,.3)}
function sndShot(ac,t,m){
 const dl=(m.R||0)/343;/* the impact is seen at once; its sound arrives range/343 m/s later */
 if(SHOT){const x=ac.createBufferSource(),g=ac.createGain();x.buffer=SHOT;g.gain.value=.9;x.connect(g);g.connect(ac.destination);x.start(t)}
 /* the recorded bolt rack is quiet, so it is boosted; it starts 0.35 s after the shot and its clacks line up with the animation below */
 if(RACK){const x=ac.createBufferSource(),g=ac.createGain();x.buffer=RACK;g.gain.value=4;x.connect(g);g.connect(ac.destination);x.start(t+.35+RD)}
 if(m.hit){const k=m.T.t;
  if(k==1||k==3||k==5||k==6||k==7)steel(ac,t+m.tof+dl,m);
  else if(k==4)nz(ac,t+m.tof+dl,.012,'highpass',1200,.5,.9,.2);
  else nz(ac,t+m.tof+dl,.03,'lowpass',700,.7,.35,.1)}
 else if(m.li>=0)nz(ac,t+m.tof+dl,.03,'lowpass',450,.7,.5,.2)}
$('fire').addEventListener('click',fire);
$('rec').addEventListener('input',()=>{$('o_rec').textContent=(+$('rec').value).toFixed(2)+'×'});
addEventListener('keydown',e=>{if(e.code!=='Space')return;e.preventDefault();if(e.repeat)return;const a=document.activeElement;if(a&&a!==document.body&&a!==cv&&a.blur)a.blur();fire()});

/* phone orientation: the direction the phone's back points sets the head offset, and twisting it sets eye relief.
   Uses the high-rate Generic Sensor API where it exists (Chrome on Android) and falls back to deviceorientation. Smoothed per frame, so slow or coarse sensor updates still look continuous. */
let gyr=null,gseen=false,gsrc=null,erBase=90,erSet=null;
const gcl=(v,a,b)=>Math.max(a,Math.min(b,v)),gwrap=d=>((d+540)%360+360)%360-180,gset=t=>{const e=$('gs');e.textContent=t;e.style.display=t?'block':'none'};
function gfeed(d,u){
 const R=180/Math.PI,hd=Math.atan2(d[0],d[1])*R,el=Math.asin(gcl(d[2],-1,1))*R,hl=Math.hypot(d[0],d[1])||1,hx=-d[1]/hl,hy=d[0]/hl,
 qx=-d[2]*hy,qy=d[2]*hx,qz=d[0]*hy-d[1]*hx,roll=Math.atan2(u[0]*hx+u[1]*hy,u[0]*qx+u[1]*qy+u[2]*qz)*R;
 gseen=true;gset('');
 if(!gyr)gyr={h0:hd,e0:el,r0:roll,fx:0,fy:0,fr:0,tx:0,ty:0,tr:0};
 gyr.rh=hd;gyr.re=el;gyr.rr=roll;gyr.tx=gwrap(hd-gyr.h0);gyr.ty=el-gyr.e0;gyr.tr=gwrap(roll-gyr.r0)}
function onOri(e){
 if(e.alpha==null||e.beta==null||e.gamma==null){if(!gseen)gset('The browser sent no motion data. Check that motion sensors are allowed for this site.');return}
 const r=Math.PI/180,a=e.alpha*r,b=e.beta*r,c=e.gamma*r;
 gfeed([-(Math.cos(a)*Math.sin(c)+Math.sin(a)*Math.sin(b)*Math.cos(c)),-(Math.sin(a)*Math.sin(c)-Math.cos(a)*Math.sin(b)*Math.cos(c)),-(Math.cos(b)*Math.cos(c))],
  [-Math.sin(a)*Math.cos(b),Math.cos(a)*Math.cos(b),Math.sin(b)])}
function gfall(){addEventListener('deviceorientation',onOri);gsrc={stop:()=>removeEventListener('deviceorientation',onOri)}}
function gbegin(){
 if(window.RelativeOrientationSensor){try{const s=new RelativeOrientationSensor({frequency:60,referenceFrame:'device'});let ok=false;
  s.addEventListener('reading',()=>{ok=true;const[x,y,z,w]=s.quaternion;
   gfeed([-2*(x*z+w*y),-2*(y*z-w*x),-(1-2*(x*x+y*y))],[2*(x*y-w*z),1-2*(x*x+z*z),2*(y*z+w*x)])});
  s.addEventListener('error',()=>{if(gsrc&&gsrc.s===s){try{s.stop()}catch(e){}gsrc=null;gfall()}});
  s.start();gsrc={s,stop:()=>{try{s.stop()}catch(e){}}};return}catch(e){}}
 gfall()}
function gstop(){if(gsrc){gsrc.stop();gsrc=null}gyr=null;erSet=null}
function gstep(dt){if(!gyr)return;const k=1-Math.exp(-dt*14);gyr.fx+=(gyr.tx-gyr.fx)*k;gyr.fy+=(gyr.ty-gyr.fy)*k;gyr.fr+=(gyr.tr-gyr.fr)*k;
 if($('gyro').checked){const g=+$('gg').value;$('hx').value=gcl(-gyr.fx*g,-15,15);$('hy').value=gcl(gyr.fy*g,-15,15)}
 if($('twist').checked){const cur=+$('er').value;if(erSet!==null&&Math.abs(cur-erSet)>.05)erBase=cur+gyr.fr;$('er').value=gcl(erBase-gyr.fr,60,130);erSet=+$('er').value}}
function gfail(id,m){$(id).checked=false;if(!$('gyro').checked&&!$('twist').checked)gstop();gset(m)}
function gtap(id){
 if(id=='twist'&&$('twist').checked){erBase=+$('er').value+(gyr?gyr.fr:0);erSet=null}
 if(!$('gyro').checked&&!$('twist').checked){gstop();gset('');return}
 if(!$(id).checked)return;
 if(id=='gyro')$('follow').checked=false;
 if(gsrc)return;
 /* the permission request has to be the first thing in the tap (iOS) */
 const D=window.DeviceOrientationEvent,p=D&&typeof D.requestPermission==='function'?D.requestPermission():Promise.resolve('granted');
 if(!window.isSecureContext){gfail(id,'Motion sensors are blocked on pages opened from a file. Open this page from an https:// link.');return}
 p.then(r=>{if(r!=='granted')return gfail(id,'The browser refused motion access. Open the page directly in Chrome or Firefox, not inside another app, and try again.');
  gyr=null;gseen=false;gbegin();setTimeout(()=>{if((gsrc)&&!gseen)gset('No sensor data yet. Needs a phone and motion access.')},1500)})
  .catch(err=>gfail(id,'Motion access failed: '+(err&&err.message||err)))}
$('gyro').addEventListener('click',()=>gtap('gyro'));$('twist').addEventListener('click',()=>gtap('twist'));
$('gz').addEventListener('click',()=>{if(gyr){gyr.h0=gyr.rh;gyr.e0=gyr.re;gyr.r0=gyr.rr;gyr.fx=gyr.fy=gyr.fr=gyr.tx=gyr.ty=gyr.tr=0}});
if(!window.DeviceOrientationEvent&&!window.RelativeOrientationSensor){for(const n of['gyro','twist'])$(n).parentNode.style.display='none';$('ggl').style.display='none';$('gz').style.display='none'}

/* input */
['hx','hy'].forEach(id=>$(id).addEventListener('input',()=>{$('follow').checked=false}));
let tap=null;
cv.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY};tap={x:e.clientX,y:e.clientY,t:performance.now()};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',e=>{drag=null;if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<8&&performance.now()-tap.t<400)fire();tap=null});
cv.addEventListener('pointercancel',()=>{drag=null;tap=null});
cv.addEventListener('pointermove',e=>{
 const mag=+$('mag').value,fovS=20/mag;
 if(drag&&(e.pointerType!='mouse'||!$('follow').checked)){const r=Math.min(W*.47,H*.46)*.84,k=fovS/(2*r);yaw-=(e.clientX-drag.x)*k;pitch+=(e.clientY-drag.y)*k;yaw=Math.max(-60,Math.min(60,yaw));pitch=Math.max(-4,Math.min(8,pitch));drag={x:e.clientX,y:e.clientY}}
 else if(e.pointerType=='mouse'&&$('follow').checked){const Ro=Math.min(W*.47,H*.46),b=cv.getBoundingClientRect(),c=Math.max(-15,Math.min(15,-(e.clientX-b.left-(W-lay().rp)/2)/Ro*14)),v=Math.max(-15,Math.min(15,-(e.clientY-b.top-H/2)/Ro*14));$('hx').value=c;$('hy').value=v}
});
cv.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)return;e.preventDefault();
 const id=e.shiftKey?'er':'mag',s=$(id),k={mag:.005,er:.05}[id];
 s.value=Math.max(+s.min,Math.min(+s.max,+s.value-(e.deltaY||e.deltaX)*k))},{passive:false});
